name: BLAS ASAN CI

# gfx90a ASAN build + test for hipBLASLt and its downstream BLAS/SOLVER
# consumers, all in one file with per-component triggering:
#
#   - hipBLASLt: runs on every hipBLASLt PR (changes under projects/hipblaslt/**)
#     or workflow_dispatch; TEST_TYPE=pre_checkin; GATES (fails the PR check).
#   - rocBLAS / rocSOLVER / hipSOLVER / hipBLAS: opt-in only via the `ci:asan`
#     label (or workflow_dispatch); TEST_TYPE=quick; does NOT gate. Changes to a
#     downstream component do NOT trigger any ASAN run on their own.
#
# Scope (both paths):
#   - gfx90a only (host-side ASAN; device xnack+ is gfx942/gfx950 only)
#   - per-subproject `<target>_SANITIZER=ASAN` for the BLAS subprojects;
#     everything else compiles with normal flags (shared-cache ccache hits)
#   - full ASAN checks; only HSA-runtime teardown leaks suppressed (lsan.supp)

on:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: "Gate (hipBLASLt path / ci:asan label)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hipblaslt: ${{ steps.gate.outputs.hipblaslt }}
      downstream: ${{ steps.gate.outputs.downstream }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:asan') }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          hipblaslt=false
          downstream=false
          if [[ "$IS_DISPATCH" == "true" ]]; then
            # Manual runs exercise everything.
            hipblaslt=true
            downstream=true
          else
            # Downstream components are opt-in via the label only.
            if [[ "$HAS_LABEL" == "true" ]]; then
              downstream=true
            fi
            # hipBLASLt runs automatically on any PR that touches it.
            if [[ -n "$PR" ]]; then
              files=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path' || true)
              if echo "$files" | grep -qE '^projects/hipblaslt/'; then
                hipblaslt=true
              fi
            fi
          fi
          echo "hipblaslt=$hipblaslt" >> "$GITHUB_OUTPUT"
          echo "downstream=$downstream" >> "$GITHUB_OUTPUT"
          echo "gate: dispatch=$IS_DISPATCH label=$HAS_LABEL -> hipblaslt=$hipblaslt downstream=$downstream"

  setup:
    name: "Setup"
    needs: gate
    if: needs.gate.outputs.hipblaslt == 'true' || needs.gate.outputs.downstream == 'true'
    runs-on: ubuntu-24.04
    outputs:
      therock_ref: ${{ steps.ci-env.outputs.therock-ref }}
      docker_image: ${{ steps.ci-env.outputs.docker-image }}
      build_runs_on: ${{ steps.ci-env.outputs.linux-runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Load CI environment
        id: ci-env
        uses: ./.github/actions/ci-env

  # ----------------------------------------------------------------------------
  # hipBLASLt: auto on hipBLASLt PRs, pre_checkin, GATING
  # ----------------------------------------------------------------------------
  build_hipblaslt:
    name: "Build hipBLASLt (gfx90a | ASAN)"
    needs: [gate, setup]
    if: needs.gate.outputs.hipblaslt == 'true'
    runs-on: ${{ needs.setup.outputs.build_runs_on }}
    permissions:
      id-token: write
    container:
      image: ${{ needs.setup.outputs.docker_image }}
      options: -v /runner/config:/home/awsconfig/
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: gfx90a
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      ARTIFACT_GROUP: gfx90a-asan
    steps:
      - name: "Check out rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: ${{ needs.setup.outputs.therock_ref }}
      - name: Install python deps
        run: pip install -r TheRock/requirements.txt
      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10
      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"
      - name: Runner health status
        run: ./TheRock/build_tools/health_status.py
      - name: Pull DVC files for rocm-libraries
        run: |
          command -v dvc &> /dev/null && echo "dvc detected" || echo "Warning, dvc not detected!"
          LOGNAME=github-runner dvc pull -v
      - name: Fetch sources
        timeout-minutes: 30
        run: ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks
      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          # Instrument only hipBLASLt; rocprofiler-sdk test build disabled (its
          # test kernel needs a HIP runtime not staged on this path).
          extra_cmake_options: "-DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=../ -DhipBLASLt_SANITIZER=ASAN -Drocprofiler-sdk_CMAKE_ARGS=-DROCPROFILER_BUILD_TESTS=OFF"
          BUILD_DIR: build
        run: python3 TheRock/build_tools/github_actions/build_configure.py
      - name: Build hipBLASLt (ASAN)
        run: cmake --build TheRock/build --target hipBLASLt -- -k 0
      - name: Package hipBLASLt trees
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p upload/hipblaslt
          for kind in stage dist; do
            d=$(find TheRock/build -maxdepth 6 -type d -path "*/math-libs/BLAS/hipBLASLt/${kind}" 2>/dev/null | head -1)
            if [ -n "$d" ] && [ -d "$d" ]; then
              tar -C "$d" -czf "upload/hipblaslt/hipblaslt-${kind}.tar.gz" . && echo "packaged hipBLASLt/${kind}"
            else
              echo "::warning::no hipBLASLt/${kind} tree found"
            fi
          done
          ccache -s -v || true
      - name: Upload hipBLASLt trees
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-trees-hipblaslt
          path: upload/hipblaslt/*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  test_hipblaslt:
    name: "Test hipBLASLt ASAN (pre_checkin)"
    needs: [gate, setup, build_hipblaslt]
    if: needs.gate.outputs.hipblaslt == 'true'
    runs-on: linux-gfx90a-gpu-rocm
    timeout-minutes: 210
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    env:
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      THEROCK_DIR: ${{ github.workspace }}
      AMDGPU_FAMILIES: gfx90a
      ARTIFACT_GROUP: gfx90a-asan
      TEST_COMPONENT: hipblaslt
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.therock_ref }}
      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: rocm-libraries
      - name: Download hipBLASLt ASAN trees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: asan-trees-hipblaslt
          path: asan-trees
      - name: Assemble runnable tree from dist (+ stage overlay)
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ARTIFACTS_DIR}"
          tar -C "${OUTPUT_ARTIFACTS_DIR}" -xzf "asan-trees/hipblaslt-dist.tar.gz"
          if [ -f "asan-trees/hipblaslt-stage.tar.gz" ]; then
            tar -C "${OUTPUT_ARTIFACTS_DIR}" -xzf "asan-trees/hipblaslt-stage.tar.gz"
          fi
          test -x "${THEROCK_BIN_DIR}/hipblaslt-test"
      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          export PATH="${GITHUB_WORKSPACE}/build/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/lib:${LD_LIBRARY_PATH:-}"
          timeout -k 10 120 python3 ./build_tools/print_driver_gpu_info.py || true
      - name: ASAN runtime environment
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/build"
          ASAN_RT_DIR="$(dirname "$(find "$OUT/lib/llvm/lib/clang" -name 'libclang_rt.asan-x86_64.so' | head -1)")"
          LSAN_SUPP="${GITHUB_WORKSPACE}/rocm-libraries/test/therock/lsan.supp"
          {
            echo "ASAN_OPTIONS=quarantine_size_mb=600"
            echo "LSAN_OPTIONS=suppressions=${LSAN_SUPP}:print_suppressions=0"
            echo "HSA_XNACK=1"
            echo "ASAN_SYMBOLIZER_PATH=${OUT}/lib/llvm/bin/llvm-symbolizer"
            echo "LD_LIBRARY_PATH=${OUT}/lib:${ASAN_RT_DIR}:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
      - name: Test hipBLASLt (pre_checkin)
        timeout-minutes: 180
        env:
          SHARD_INDEX: 1
          TOTAL_SHARDS: 1
          TEST_TYPE: pre_checkin
        run: |
          mkdir -p ./test_logs
          python3 rocm-libraries/test/therock/test_hipblaslt.py 2>&1 | tee ./test_logs/hipblaslt-test_output.log

  # ----------------------------------------------------------------------------
  # Downstream rocBLAS / rocSOLVER / hipSOLVER / hipBLAS:
  # ci:asan label only, quick, NON-gating
  # ----------------------------------------------------------------------------
  build_downstream:
    name: "Build downstream BLAS stack (gfx90a | ASAN)"
    needs: [gate, setup]
    if: needs.gate.outputs.downstream == 'true'
    runs-on: ${{ needs.setup.outputs.build_runs_on }}
    permissions:
      id-token: write
    container:
      image: ${{ needs.setup.outputs.docker_image }}
      options: -v /runner/config:/home/awsconfig/
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: gfx90a
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      ARTIFACT_GROUP: gfx90a-asan
    steps:
      - name: "Check out rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: ${{ needs.setup.outputs.therock_ref }}
      - name: Install python deps
        run: pip install -r TheRock/requirements.txt
      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10
      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"
      - name: Runner health status
        run: ./TheRock/build_tools/health_status.py
      - name: Pull DVC files for rocm-libraries
        run: |
          command -v dvc &> /dev/null && echo "dvc detected" || echo "Warning, dvc not detected!"
          LOGNAME=github-runner dvc pull -v
      - name: Fetch sources
        timeout-minutes: 30
        run: ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks
      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          # Instrument the 5 BLAS subprojects (hipBLASLt is the linked ASAN dep).
          extra_cmake_options: "-DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=../ -DhipBLASLt_SANITIZER=ASAN -DrocBLAS_SANITIZER=ASAN -DrocSOLVER_SANITIZER=ASAN -DhipSOLVER_SANITIZER=ASAN -DhipBLAS_SANITIZER=ASAN -Drocprofiler-sdk_CMAKE_ARGS=-DROCPROFILER_BUILD_TESTS=OFF"
          BUILD_DIR: build
        run: python3 TheRock/build_tools/github_actions/build_configure.py
      - name: Build BLAS stack (ASAN)
        run: |
          cmake --build TheRock/build \
            --target hipBLASLt rocBLAS rocSOLVER hipSOLVER hipBLAS \
            -- -k 0
      - name: Package downstream trees
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p upload
          comps="rocblas:rocBLAS rocsolver:rocSOLVER hipsolver:hipSOLVER hipblas:hipBLAS"
          for pair in $comps; do
            name="${pair%%:*}"; cdir="${pair##*:}"
            mkdir -p "upload/${name}"
            for kind in stage dist; do
              d=$(find TheRock/build -maxdepth 6 -type d -path "*/math-libs/BLAS/${cdir}/${kind}" 2>/dev/null | head -1)
              if [ -n "$d" ] && [ -d "$d" ]; then
                tar -C "$d" -czf "upload/${name}/${name}-${kind}.tar.gz" . && echo "packaged ${cdir}/${kind}"
              else
                echo "::warning::no ${cdir}/${kind} tree found"
              fi
            done
          done
          ccache -s -v || true
      - name: Upload rocBLAS trees
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-trees-rocblas
          path: upload/rocblas/*.tar.gz
          if-no-files-found: warn
          retention-days: 7
      - name: Upload rocSOLVER trees
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-trees-rocsolver
          path: upload/rocsolver/*.tar.gz
          if-no-files-found: warn
          retention-days: 7
      - name: Upload hipSOLVER trees
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-trees-hipsolver
          path: upload/hipsolver/*.tar.gz
          if-no-files-found: warn
          retention-days: 7
      - name: Upload hipBLAS trees
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-trees-hipblas
          path: upload/hipblas/*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  test_downstream:
    name: "Test ${{ matrix.component.name }} ASAN (quick)"
    needs: [gate, setup, build_downstream]
    if: needs.gate.outputs.downstream == 'true'
    runs-on: linux-gfx90a-gpu-rocm
    timeout-minutes: 210
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: rocblas,   bin: rocblas-test,   script: test_rocblas.py }
          - { name: rocsolver, bin: rocsolver-test, script: test_rocsolver.py }
          - { name: hipsolver, bin: hipsolver-test, script: test_hipsolver.py }
          - { name: hipblas,   bin: hipblas-test,   script: test_hipblas.py }
    defaults:
      run:
        shell: bash
    env:
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      THEROCK_DIR: ${{ github.workspace }}
      AMDGPU_FAMILIES: gfx90a
      ARTIFACT_GROUP: gfx90a-asan
      TEST_COMPONENT: ${{ matrix.component.name }}
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.therock_ref }}
      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: rocm-libraries
      - name: Download ${{ matrix.component.name }} ASAN trees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: asan-trees-${{ matrix.component.name }}
          path: asan-trees
      - name: Assemble runnable tree from dist (+ stage overlay)
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ARTIFACTS_DIR}"
          tar -C "${OUTPUT_ARTIFACTS_DIR}" -xzf "asan-trees/${{ matrix.component.name }}-dist.tar.gz"
          if [ -f "asan-trees/${{ matrix.component.name }}-stage.tar.gz" ]; then
            tar -C "${OUTPUT_ARTIFACTS_DIR}" -xzf "asan-trees/${{ matrix.component.name }}-stage.tar.gz"
          fi
          test -x "${THEROCK_BIN_DIR}/${{ matrix.component.bin }}"
      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          export PATH="${GITHUB_WORKSPACE}/build/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/lib:${LD_LIBRARY_PATH:-}"
          timeout -k 10 120 python3 ./build_tools/print_driver_gpu_info.py || true
      - name: ASAN runtime environment
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/build"
          ASAN_RT_DIR="$(dirname "$(find "$OUT/lib/llvm/lib/clang" -name 'libclang_rt.asan-x86_64.so' | head -1)")"
          LSAN_SUPP="${GITHUB_WORKSPACE}/rocm-libraries/test/therock/lsan.supp"
          {
            echo "ASAN_OPTIONS=quarantine_size_mb=600"
            echo "LSAN_OPTIONS=suppressions=${LSAN_SUPP}:print_suppressions=0"
            echo "HSA_XNACK=1"
            echo "ASAN_SYMBOLIZER_PATH=${OUT}/lib/llvm/bin/llvm-symbolizer"
            echo "LD_LIBRARY_PATH=${OUT}/lib:${ASAN_RT_DIR}:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
      - name: Test ${{ matrix.component.name }} (quick)
        timeout-minutes: 180
        env:
          SHARD_INDEX: 1
          TOTAL_SHARDS: 1
          TEST_TYPE: quick
        run: |
          mkdir -p ./test_logs
          python3 "rocm-libraries/test/therock/${{ matrix.component.script }}" 2>&1 | tee "./test_logs/${{ matrix.component.name }}-test_output.log"

  summary:
    name: "BLAS ASAN CI Summary"
    if: always()
    needs:
      - gate
      - build_hipblaslt
      - test_hipblaslt
      - build_downstream
      - test_downstream
    runs-on: ubuntu-24.04
    steps:
      - name: Report (gates on hipBLASLt only)
        env:
          RUN_HB: ${{ needs.gate.outputs.hipblaslt }}
          RUN_DN: ${{ needs.gate.outputs.downstream }}
          BUILD_HB: ${{ needs.build_hipblaslt.result }}
          TEST_HB: ${{ needs.test_hipblaslt.result }}
          BUILD_DN: ${{ needs.build_downstream.result }}
          TEST_DN: ${{ needs.test_downstream.result }}
        run: |
          echo "hipBLASLt:  run=${RUN_HB}  build=${BUILD_HB}  test=${TEST_HB}  (GATING)"
          echo "downstream: run=${RUN_DN}  build=${BUILD_DN}  test=${TEST_DN}  (informational)"
          if [[ "$RUN_HB" == "true" && ( "$BUILD_HB" != "success" || "$TEST_HB" != "success" ) ]]; then
            echo "::error::hipBLASLt ASAN failed (build=${BUILD_HB} test=${TEST_HB})"
            exit 1
          fi
